<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f8fa">
    <title>CMP Mermaid</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #f7f8fa;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
    </style>
    <script>
        if (window.location.hostname.endsWith(".github.io")) {
            WebAssembly.instantiateStreaming = async (source, imports, options) => {
                const response = await source;
                const bytes = await response.arrayBuffer();
                return WebAssembly.instantiate(bytes, imports, options);
            };
        }
    </script>
    <script defer type="application/javascript" src="cmp-mermaid.js"></script>
</head>
<body></body>
</html>
