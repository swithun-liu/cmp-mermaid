<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f8fa">
    <title>CMP Mermaid</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #f7f8fa;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
    </style>
    <script>
        if (window.location.hostname.endsWith(".github.io")) {
            const nativeInstantiate = WebAssembly.instantiate.bind(WebAssembly);

            WebAssembly.instantiateStreaming = async (source, imports, options) => {
                const response = await source;
                const manifestResponse = await fetch(`${response.url}.chunks.json`);
                if (!manifestResponse.ok) {
                    return nativeInstantiate(
                        await response.arrayBuffer(),
                        imports,
                        options,
                    );
                }

                const manifest = await manifestResponse.json();
                const chunks = [];
                const batchSize = 6;
                for (let start = 0; start < manifest.chunks.length; start += batchSize) {
                    const batch = manifest.chunks.slice(start, start + batchSize);
                    const loaded = await Promise.all(
                        batch.map(async (chunkName) => {
                            const chunkUrl = new URL(chunkName, response.url);
                            const chunkResponse = await fetch(chunkUrl);
                            if (!chunkResponse.ok) {
                                throw new Error(`Failed to load ${chunkUrl}`);
                            }
                            return new Uint8Array(await chunkResponse.arrayBuffer());
                        }),
                    );
                    chunks.push(...loaded);
                }

                const bytes = new Uint8Array(manifest.byteLength);
                let offset = 0;
                for (const chunk of chunks) {
                    bytes.set(chunk, offset);
                    offset += chunk.byteLength;
                }
                return nativeInstantiate(bytes, imports, options);
            };
        }
    </script>
    <script defer type="application/javascript" src="cmp-mermaid.js"></script>
</head>
<body></body>
</html>
