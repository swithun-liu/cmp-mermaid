name: CMPMermaid
options:
  bundleIdPrefix: io.github.cmpmermaid
  deploymentTarget:
    iOS: "17.2"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS:
      - "$(inherited)"
      - "$(SRCROOT)/../../mermaid-debug-ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS:
      - "$(inherited)"
      - "-framework"
      - "CmpMermaidDebugUi"
targets:
  CMPMermaid:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: CMP Mermaid
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cmpmermaid.sample
        PRODUCT_NAME: CMP Mermaid
        TARGETED_DEVICE_FAMILY: "1,2"
    preBuildScripts:
      - name: Build CMP Mermaid KMP framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          ./gradlew :mermaid-debug-ui:embedAndSignAppleFrameworkForXcode
schemes:
  CMPMermaid:
    build:
      targets:
        CMPMermaid: all
    run:
      config: Debug
