<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; object-src 'none'; frame-src 'none'; worker-src blob:"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Official Mermaid</title>
  <link rel="icon" href="data:,">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
      color: #28253d;
      font-family: Arial, sans-serif;
    }

    #diagram {
      box-sizing: border-box;
      display: flex;
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    #diagram svg {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
    }

    #diagram.error {
      padding: 24px;
      color: #b91c1c;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
      white-space: pre-wrap;
    }

    #diagram.status {
      color: #5f5b66;
      font-size: 13px;
    }
  </style>
  <script>
    if (!Object.hasOwn) {
      Object.hasOwn = (target, key) =>
        Object.prototype.hasOwnProperty.call(target, key);
    }
    if (!Array.prototype.at) {
      Object.defineProperty(Array.prototype, "at", {
        value(index) {
          const offset = Math.trunc(index) || 0;
          return this[offset < 0 ? this.length + offset : offset];
        },
      });
    }
    if (!String.prototype.at) {
      Object.defineProperty(String.prototype, "at", {
        value(index) {
          const offset = Math.trunc(index) || 0;
          return this[offset < 0 ? this.length + offset : offset];
        },
      });
    }
  </script>
  <script src="/assets/mermaid-12.0.0.min.js"></script>
</head>
<body>
  <div id="diagram" class="status">Loading official renderer...</div>
  <script>
    (() => {
      const diagram = document.querySelector("#diagram");
      let requestId = 0;

      window.renderFlowchart = async (source, layout) => {
        const currentRequest = ++requestId;
        diagram.className = "status";
        diagram.textContent = "Rendering...";

        try {
          mermaid.initialize({
            startOnLoad: false,
            securityLevel: "strict",
            layout,
          });
          const result = await mermaid.render(
            `cmp-official-${currentRequest}`,
            source,
            diagram,
          );
          if (currentRequest !== requestId) {
            return;
          }
          diagram.className = "";
          diagram.innerHTML = result.svg;
          const svg = diagram.querySelector("svg");
          if (svg) {
            svg.style.width = "100%";
            svg.style.height = "100%";
            svg.style.maxWidth = "100%";
            svg.style.maxHeight = "100%";
            svg.style.backgroundColor = "#ffffff";
          }
          result.bindFunctions?.(diagram);
        } catch (failure) {
          if (currentRequest !== requestId) {
            return;
          }
          diagram.className = "error";
          diagram.textContent = failure?.message ?? String(failure);
        }
      };
    })();
  </script>
</body>
</html>
