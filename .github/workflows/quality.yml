name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multiplatform:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify generated stability corpus
        run: |
          node tools/official-reference/generate-stability-corpus.mjs
          git diff --exit-code -- \
            mermaid-core/src/commonTest/kotlin/io/github/cmpmermaid/core/generated/StabilityCorpus.kt \
            mermaid-debug-ui/src/commonMain/kotlin/io/github/cmpmermaid/debugui/generated/StabilityCorpus.kt

      - name: Test JVM modules
        run: |
          ./gradlew \
            :mermaid-core:jvmTest \
            :mermaid-compose:jvmTest

      - name: Build all targets
        run: |
          ./gradlew \
            :sample:androidApp:assembleDebug \
            :sample:webApp:wasmJsBrowserDistribution \
            :sample:desktopApp:assemble \
            :mermaid-core:compileKotlinIosArm64 \
            :mermaid-core:compileKotlinIosSimulatorArm64 \
            :mermaid-core:compileKotlinIosX64 \
            :mermaid-compose:compileKotlinIosArm64 \
            :mermaid-compose:compileKotlinIosSimulatorArm64 \
            :mermaid-compose:compileKotlinIosX64 \
            :mermaid-debug-ui:compileKotlinIosArm64 \
            :mermaid-debug-ui:compileKotlinIosSimulatorArm64 \
            :mermaid-debug-ui:compileKotlinIosX64

      - name: Reject Internet permission in sample APK
        shell: bash
        run: |
          set -euo pipefail
          apk="sample/androidApp/build/outputs/apk/debug/androidApp-debug.apk"
          aapt2=""
          for candidate in "$ANDROID_HOME"/build-tools/*/aapt2; do
            if [[ -x "$candidate" ]]; then
              aapt2="$candidate"
            fi
          done
          test -n "$aapt2"
          permissions="$("$aapt2" dump permissions "$apk")"
          printf '%s\n' "$permissions"
          if grep -q 'android.permission.INTERNET' <<<"$permissions"; then
            echo "Unexpected android.permission.INTERNET declaration" >&2
            exit 1
          fi

  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/official-reference/package-lock.json

      - name: Install visual audit dependencies
        working-directory: tools/official-reference
        run: npm ci

      - name: Build Web production distribution
        run: ./gradlew :sample:webApp:wasmJsBrowserDistribution

      - name: Capture Native and Official RC corpus
        working-directory: tools/official-reference
        run: |
          python3 -m http.server 8093 \
            --directory ../../sample/webApp/build/dist/wasmJs/productionExecutable \
            >/tmp/cmp-mermaid-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8093/ >/dev/null; then
              break
            fi
            sleep 1
          done
          AUDIT_SOURCE=stability \
          OUTPUT_DIR=captures/ci/stability \
          BASE_URL=http://127.0.0.1:8093/ \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          npm run capture:web-audit
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/ci/load-test-web \
          npm run test:web-load

      - name: Enforce RC visual geometry
        working-directory: tools/official-reference
        run: |
          INPUT_DIR=captures/ci/stability \
          OUTPUT_FILE=captures/ci/stability-geometry.json \
          npm run audit:stability-geometry
          INPUT_DIR=captures/ci/stability \
          OUTPUT_DIR=captures/ci/contact-sheets \
          npm run generate:stability-contact-sheets

      - name: Upload RC visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-visual-evidence
          path: captures/ci
          retention-days: 14
