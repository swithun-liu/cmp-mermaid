name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag to build or recover
        required: true
        type: string

permissions:
  actions: read
  contents: write

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag and version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          expected_tag="v$version"
          test "$REQUESTED_TAG" = "$expected_tag"
          test "$(git tag --points-at HEAD --list "$expected_tag")" = "$expected_tag"
          if release_json="$(gh release view "$expected_tag" --json isDraft,isPrerelease 2>/dev/null)"; then
            is_draft="$(jq -r '.isDraft' <<<"$release_json")"
            is_prerelease="$(jq -r '.isPrerelease' <<<"$release_json")"
            if [[ "$is_draft" != "true" && "$is_prerelease" != "true" ]]; then
              echo "Release $expected_tag is already finalized" >&2
              exit 1
            fi
            echo "::notice::Resuming existing unfinished release $expected_tag"
          fi
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$version"
            echo "tag=$expected_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Reject private material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -n -E \
            '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})'
          then
            echo "Credential-like material detected" >&2
            exit 1
          fi

  build-modern-maven:
    needs: validate
    runs-on: macos-14
    timeout-minutes: 75

    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ needs.validate.outputs.tag }}
          sparse-checkout: |
            /*
            !/docs/assets/
            /docs/assets/invalid-source-report/invalid-source-manifest.json
          sparse-checkout-cone-mode: false

      - name: Validate signing secrets
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEY SIGNING_KEY_ID SIGNING_KEY_PASSWORD; do
            test -n "${!name:-}" || {
              echo "Missing required signing secret: $name" >&2
              exit 1
            }
          done

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build modern Maven artifacts
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew \
            :mermaid-core:jvmTest \
            :mermaid-compose:jvmTest \
            verifyPublicationCoordinates \
            :mermaid-core:publishAllPublicationsToBuildRepository \
            :mermaid-compose:publishAllPublicationsToBuildRepository \
            --console=plain

      - name: Upload modern Maven repository
        uses: actions/upload-artifact@v7
        with:
          name: modern-maven-repository
          path: build/maven-repository
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14

  reuse-verified-ios:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout current release verification tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: .release-tooling
          ref: ${{ github.workflow_sha }}
          sparse-checkout: tools/release

      - name: Download the exact Quality Gate iOS artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          quality_run_id=""
          quality_artifact_id=""
          for attempt in $(seq 1 120); do
            quality_runs="$(
              gh run list \
                --workflow quality.yml \
                --commit "$SOURCE_SHA" \
                --event push \
                --limit 20 \
                --json databaseId,headBranch,headSha,status,conclusion
            )"
            while IFS= read -r candidate_run_id; do
              [[ -n "$candidate_run_id" ]] || continue
              if ! candidate_artifact_id="$(
                node .release-tooling/tools/release/verified-quality-ios-artifact.mjs \
                  "$GITHUB_REPOSITORY" "$candidate_run_id" "$SOURCE_SHA"
              )"; then
                continue
              fi
              if [[ -n "$candidate_artifact_id" ]]; then
                quality_run_id="$candidate_run_id"
                quality_artifact_id="$candidate_artifact_id"
                break
              fi
            done < <(
              jq -r \
                --arg sha "$SOURCE_SHA" \
                '.[]
                | select(
                    .headSha == $sha
                    and .headBranch == "main"
                  )
                | .databaseId' \
                <<<"$quality_runs"
            )
            if [[ -n "$quality_artifact_id" ]]; then
              break
            fi
            echo "Waiting for a verified main push iOS artifact for $SOURCE_SHA ($attempt/120)"
            sleep 20
          done
          if [[ -z "$quality_artifact_id" ]]; then
            echo "No verified main push iOS artifact found for $SOURCE_SHA" >&2
            exit 1
          fi

          publication_dir="mermaid-compose/build/cocoapods/publish/release"
          mkdir -p "$publication_dir"
          artifact_zip="$RUNNER_TEMP/verified-ios-publication.zip"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$quality_artifact_id/zip" \
            > "$artifact_zip"
          unzip -q "$artifact_zip" -d "$publication_dir"

          provenance_file="$publication_dir/quality-source-commit.txt"
          test -f "$provenance_file"
          test "$(cat "$provenance_file")" = "$SOURCE_SHA"
          test -d "$publication_dir/CMPMermaid.xcframework"
          test -f "$publication_dir/CMPMermaid.podspec"
          rm "$provenance_file"
          echo "Reused verified iOS publication from Quality Gate run $quality_run_id"

      - name: Upload iOS publication
        uses: actions/upload-artifact@v7
        with:
          name: ios-publication
          path: mermaid-compose/build/cocoapods/publish/release
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14

  build-kotlin17-android:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ needs.validate.outputs.tag }}
          sparse-checkout: |
            /*
            !/docs/assets/
          sparse-checkout-cone-mode: false

      - name: Validate signing secrets
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEY SIGNING_KEY_PASSWORD; do
            test -n "${!name:-}" || {
              echo "Missing required signing secret: $name" >&2
              exit 1
            }
          done

      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and consume Kotlin 1.7 Android artifacts
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./android-legacy-build/gradlew -p android-legacy-build \
            -PVERSION_NAME="${{ needs.validate.outputs.version }}" \
            assembleRelease \
            verifyLegacyPublicationCoordinates \
            publishLegacyToReleaseRepository \
            --console=plain
          ./android-legacy-build/gradlew \
            -p android-legacy-build/consumer-smoke \
            -PVERSION_NAME="${{ needs.validate.outputs.version }}" \
            assembleRelease \
            --console=plain

      - name: Upload Kotlin 1.7 Maven repository
        uses: actions/upload-artifact@v7
        with:
          name: kotlin17-maven-repository
          path: build/maven-repository
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14

  prepare-release-assets:
    needs:
      - validate
      - build-modern-maven
      - reuse-verified-ios
      - build-kotlin17-android
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ needs.validate.outputs.tag }}
          sparse-checkout: |
            /*
            !/docs/assets/
          sparse-checkout-cone-mode: false

      - name: Checkout current release tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: .release-tooling
          ref: ${{ github.workflow_sha }}
          sparse-checkout: tools/release

      - name: Use current release tooling
        shell: bash
        run: |
          set -euo pipefail
          tooling_dir="$RUNNER_TEMP/cmp-mermaid-release-tooling"
          rm -rf "$tooling_dir"
          mkdir -p "$tooling_dir"
          cp -R .release-tooling/tools/release/. "$tooling_dir/"
          rm -rf .release-tooling
          echo "RELEASE_TOOLING_DIR=$tooling_dir" >> "$GITHUB_ENV"

      - name: Download modern Maven repository
        uses: actions/download-artifact@v8
        with:
          name: modern-maven-repository
          path: build/maven-repository

      - name: Download Kotlin 1.7 Maven repository
        uses: actions/download-artifact@v8
        with:
          name: kotlin17-maven-repository
          path: build/maven-repository

      - name: Download iOS publication
        uses: actions/download-artifact@v8
        with:
          name: ios-publication
          path: mermaid-compose/build/cocoapods/publish/release

      - name: Assemble release assets
        run: |
          CMP_MERMAID_ROOT_DIR="$GITHUB_WORKSPACE" \
            "$RELEASE_TOOLING_DIR/assemble-release-assets.sh" \
            "${{ needs.validate.outputs.version }}"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: build/release/${{ needs.validate.outputs.version }}/cmp-mermaid-${{ needs.validate.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Normalize SBOM workspace paths
        run: |
          node "$RELEASE_TOOLING_DIR/normalize-sbom-paths.mjs" \
            "build/release/${{ needs.validate.outputs.version }}/cmp-mermaid-${{ needs.validate.outputs.version }}.cdx.json" \
            "$GITHUB_WORKSPACE"

      - name: Verify release assets
        env:
          REQUIRE_SIGNATURES: "true"
        run: |
          "$RELEASE_TOOLING_DIR/generate-checksums.sh" \
            "build/release/${{ needs.validate.outputs.version }}"
          CMP_MERMAID_ROOT_DIR="$GITHUB_WORKSPACE" \
            "$RELEASE_TOOLING_DIR/verify-release-assets.sh" \
            "build/release/${{ needs.validate.outputs.version }}" \
            "${{ needs.validate.outputs.version }}"
          DRY_RUN=true "$RELEASE_TOOLING_DIR/upload-central-bundle.sh" \
            "build/release/${{ needs.validate.outputs.version }}/cmp-mermaid-maven-central-${{ needs.validate.outputs.version }}.zip"
          DRY_RUN=true "$RELEASE_TOOLING_DIR/upload-central-bundle.sh" \
            "build/release/${{ needs.validate.outputs.version }}/cmp-mermaid-android-kotlin17-central-${{ needs.validate.outputs.version }}.zip"

      - name: Preserve verified release assets
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-assets
          path: build/release/${{ needs.validate.outputs.version }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14

      - name: Preserve modern Maven Central bundle
        uses: actions/upload-artifact@v7
        with:
          name: modern-central-bundle
          path: build/release/${{ needs.validate.outputs.version }}/cmp-mermaid-maven-central-${{ needs.validate.outputs.version }}.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14

      - name: Preserve Kotlin 1.7 Maven Central bundle
        uses: actions/upload-artifact@v7
        with:
          name: kotlin17-central-bundle
          path: build/release/${{ needs.validate.outputs.version }}/cmp-mermaid-android-kotlin17-central-${{ needs.validate.outputs.version }}.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14

      - name: Preserve CocoaPods spec
        uses: actions/upload-artifact@v7
        with:
          name: cocoapods-release-spec
          path: build/release/${{ needs.validate.outputs.version }}/CMPMermaid.podspec
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14

  stage-github-release:
    needs:
      - validate
      - prepare-release-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v8
        with:
          name: verified-release-assets
          path: build/release/${{ needs.validate.outputs.version }}

      - name: Create or update GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          tag="${{ needs.validate.outputs.tag }}"
          release_dir="build/release/$version"

          if release_json="$(gh release view "$tag" --json isDraft,isPrerelease 2>/dev/null)"; then
            is_draft="$(jq -r '.isDraft' <<<"$release_json")"
            is_prerelease="$(jq -r '.isPrerelease' <<<"$release_json")"
            if [[ "$is_draft" != "true" && "$is_prerelease" != "true" ]]; then
              echo "Release $tag is already finalized" >&2
              exit 1
            fi
            gh release upload "$tag" "$release_dir"/* --clobber
          else
            gh release create "$tag" "$release_dir"/* \
              --prerelease \
              --verify-tag \
              --title "CMP Mermaid $version" \
              --generate-notes
          fi

  publish-modern-maven:
    needs:
      - validate
      - prepare-release-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout current release tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: .release-tooling
          ref: ${{ github.workflow_sha }}
          sparse-checkout: tools/release

      - name: Download modern Maven Central bundle
        uses: actions/download-artifact@v8
        with:
          name: modern-central-bundle
          path: build/release/${{ needs.validate.outputs.version }}

      - name: Publish modern Maven artifacts
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          .release-tooling/tools/release/publish-central-bundle-if-needed.sh \
            "build/release/${{ needs.validate.outputs.version }}/cmp-mermaid-maven-central-${{ needs.validate.outputs.version }}.zip" \
            "cmp-mermaid-modern-${{ needs.validate.outputs.version }}"

  publish-kotlin17-maven:
    needs:
      - validate
      - prepare-release-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout current release tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: .release-tooling
          ref: ${{ github.workflow_sha }}
          sparse-checkout: tools/release

      - name: Download Kotlin 1.7 Maven Central bundle
        uses: actions/download-artifact@v8
        with:
          name: kotlin17-central-bundle
          path: build/release/${{ needs.validate.outputs.version }}

      - name: Publish Kotlin 1.7 Maven artifacts
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          .release-tooling/tools/release/publish-central-bundle-if-needed.sh \
            "build/release/${{ needs.validate.outputs.version }}/cmp-mermaid-android-kotlin17-central-${{ needs.validate.outputs.version }}.zip" \
            "cmp-mermaid-android-kotlin17-${{ needs.validate.outputs.version }}"

  publish-cocoapods:
    needs:
      - validate
      - prepare-release-assets
      - stage-github-release
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout current release tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: .release-tooling
          ref: ${{ github.workflow_sha }}
          sparse-checkout: tools/release

      - name: Download CocoaPods spec
        uses: actions/download-artifact@v8
        with:
          name: cocoapods-release-spec
          path: build/release/${{ needs.validate.outputs.version }}

      - name: Validate CocoaPods spec
        run: |
          pod spec lint \
            "build/release/${{ needs.validate.outputs.version }}/CMPMermaid.podspec" \
            --allow-warnings

      - name: Publish CocoaPods
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          .release-tooling/tools/release/publish-cocoapods-if-needed.sh \
            "build/release/${{ needs.validate.outputs.version }}/CMPMermaid.podspec" \
            "${{ needs.validate.outputs.version }}"

  finalize-release:
    needs:
      - validate
      - stage-github-release
      - publish-modern-maven
      - publish-kotlin17-maven
      - publish-cocoapods
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout current release tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: .release-tooling
          ref: ${{ github.workflow_sha }}
          sparse-checkout: tools/release

      - name: Download modern Maven Central bundle
        uses: actions/download-artifact@v8
        with:
          name: modern-central-bundle
          path: build/release/${{ needs.validate.outputs.version }}

      - name: Download Kotlin 1.7 Maven Central bundle
        uses: actions/download-artifact@v8
        with:
          name: kotlin17-central-bundle
          path: build/release/${{ needs.validate.outputs.version }}

      - name: Verify public repositories and finalize GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          tag="${{ needs.validate.outputs.tag }}"
          release_dir="build/release/$version"
          tooling_dir=".release-tooling/tools/release"

          release_assets="$(
            gh release view "$tag" \
              --json assets \
              --jq '.assets[].name'
          )"
          for required_asset in \
            "CMPMermaid-$version.zip" \
            "CMPMermaid.podspec" \
            "LICENSE" \
            "THIRD_PARTY_NOTICES.md" \
            "cmp-mermaid-$version.cdx.json" \
            "cmp-mermaid-android-kotlin17-central-$version.zip" \
            "cmp-mermaid-maven-central-$version.zip" \
            "cmp-mermaid-maven-$version.zip" \
            "SHA256SUMS"
          do
            grep -Fxq "$required_asset" <<<"$release_assets"
          done

          modern_state_file="$(mktemp)"
          legacy_state_file="$(mktemp)"
          trap 'rm -f "$modern_state_file" "$legacy_state_file"' EXIT
          (
            MAVEN_STATUS_ATTEMPTS=40 \
              "$tooling_dir/central-bundle-state.sh" \
              "$release_dir/cmp-mermaid-maven-central-$version.zip" \
              > "$modern_state_file"
          ) &
          modern_verify_pid=$!
          (
            MAVEN_STATUS_ATTEMPTS=40 \
              "$tooling_dir/central-bundle-state.sh" \
              "$release_dir/cmp-mermaid-android-kotlin17-central-$version.zip" \
              > "$legacy_state_file"
          ) &
          legacy_verify_pid=$!
          "$tooling_dir/cocoapods-version-published.sh" \
            CMPMermaid \
            "$version" &
          cocoapods_verify_pid=$!

          verify_failed=false
          for pid in \
            "$modern_verify_pid" \
            "$legacy_verify_pid" \
            "$cocoapods_verify_pid"
          do
            if ! wait "$pid"; then
              verify_failed=true
            fi
          done
          if [[ "$verify_failed" == "true" ]]; then
            echo "At least one public repository verification failed" >&2
            exit 1
          fi
          test "$(cat "$modern_state_file")" = "published"
          test "$(cat "$legacy_state_file")" = "published"

          gh release edit "$tag" --prerelease=false --latest
