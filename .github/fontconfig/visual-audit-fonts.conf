<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="strong">
    <family>Trebuchet MS</family>
    <prefer>
      <family>Arimo</family>
      <family>Droid Sans Fallback</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Verdana</family>
    <prefer>
      <family>Arimo</family>
      <family>Droid Sans Fallback</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Arial</family>
    <prefer>
      <family>Arimo</family>
      <family>Droid Sans Fallback</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>ArialMT</family>
    <prefer>
      <family>Arimo</family>
      <family>Droid Sans Fallback</family>
    </prefer>
  </alias>
</fontconfig>
